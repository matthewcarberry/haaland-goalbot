services:
  haaland-goal-tracker:
    # Built and published by .github/workflows/docker-publish.yml on every push to main.
    image: ghcr.io/matthewcarberry/haaland-goalbot:latest
    container_name: haaland-goal-tracker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: America/Chicago
      GIF_DIRECTORY: /app/gifs
      DATA_DIR: /app/data
      REDDIT_CLIP_DIRECTORY: /app/data/reddit-clips
    volumes:
      - /mnt/user/appdata/haaland-goal-tracker/gifs:/app/gifs
      - /mnt/user/appdata/haaland-goal-tracker/data:/app/data
    labels:
      # Icon on the Unraid Docker page. Unraid downloads it, so it must be a public URL.
      net.unraid.docker.icon: ${UNRAID_ICON_URL:-https://raw.githubusercontent.com/matthewcarberry/haaland-goalbot/main/assets/unraid-icon.png}

